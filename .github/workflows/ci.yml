name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy src scripts tests
      - name: Tests
        run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Build the distribution
        run: uv build
      - name: Verify the installed CLI is importable and refuses a private target
        run: |
          uv run python - <<'PY'
          import subprocess, sys
          from browserjev import UnsafeURLError, __all__
          assert "UnsafeURLError" in __all__
          result = subprocess.run(
              [sys.executable, "-m", "browserjev.cli", "127.0.0.1",
               "--questions", "examples/questions.json"],
              capture_output=True, text=True,
          )
          assert result.returncode == 2, result
          assert "blocked" in result.stderr, result.stderr
          assert "Traceback" not in result.stderr, result.stderr
          print("CLI refused the private target cleanly")
          PY
