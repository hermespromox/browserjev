[project]
name = "browserjev"
version = "0.1.0"
description = "Low-memory autonomous web classification with HTTPX, Lightpanda and Jev"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "BrowserJev contributors"}]
dependencies = [
  "httpx>=0.27,<1",
  "selectolax>=0.3.21,<1",
  "pydantic>=2.7,<3",
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
browserjev = "browserjev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browserjev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
