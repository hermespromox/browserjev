[project]
name = "browserjev"
version = "0.1.0"
description = "Low-memory autonomous web classification with HTTPX, Lightpanda and Jev"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "BrowserJev contributors"}]
keywords = ["crawler", "web-agent", "classification", "http", "lightpanda", "ssrf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "selectolax>=0.3.21,<1",
  "pydantic>=2.7,<3",
  "websockets>=12,<16",
]

[project.urls]
Homepage = "https://github.com/hermespromox/browserjev"
Repository = "https://github.com/hermespromox/browserjev"
Issues = "https://github.com/hermespromox/browserjev/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
browserjev = "browserjev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browserjev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "tests"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
